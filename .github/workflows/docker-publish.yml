name: Build and Push Docker Image

on:
  push:
    tags: ["v*", "*.*.*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      has-secrets: ${{ steps.c.outputs.has }}
    steps:
      - id: c
        env:
          S: ${{ toJSON(secrets) }}
        run: |
          if echo "$S" | grep -q '"DOCKERHUB_USERNAME"'; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN, 跳过构建(仓库首页不会变红)"
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: preflight
    if: needs.preflight.outputs.has-secrets == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/strm-thumb
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
