# STRM 缩略图生成器 — docker compose 示例
# 用法: 把 /path/to/media 改成你的 strm 媒体库目录, 然后 docker compose up -d
#   docker compose up -d           启动
#   docker compose logs -f         看日志
#   docker compose pull && docker compose up -d   升级到新版本
# 前端: http://NAS的IP:8081  (状态/统计/日志 + 手动触发扫描按钮; 8080 常被 qBittorrent 占用, 故默认 8081)
#
# ★ v1.0.5 起为纯手动模式(代码层面): 没有任何定时/启动自扫/循环,
#   只有打开 Web 点「▶ 立即扫描一次」才开始扫描; 旧版 compose 里的
#   CRON / INTERVAL / RUN_ON_START / RUN_ONCE / GEN_STRATEGY 一律忽略。
#   所有配置(扫描目录/截取时间点/限速等)都在 Web 上改,
#   保存进 ./data/config.json, 重启不丢失。
# ★ 限速(防打爆网盘触发风控): 每处理 1 个文件休息 FILE_DELAY 秒,
#   每 BATCH_SIZE 个再休息 BATCH_REST 秒; 默认 5s / 30 个 / 60s。
# ★ v1.0.6 起移除排除目录(EXCLUDE_PATHS 一并忽略): 不想扫的目录不要挂载/不要勾选即可。

services:
  strm-thumb:
    image: chensen2591/strm-thumb:latest
    container_name: strm-thumb
    restart: unless-stopped
    ports:
      - "8081:8081"          # Web 前端端口
    environment:
      # 扫描目录: 多个用换行(或逗号)分隔, 注意是「容器内」路径, 与下面 volumes 对应
      # (首次部署用这里; 一旦 Web 上保存过配置, 就以 ./data/config.json 为准)
      SCAN_PATHS: "/link"
      # 截取时间点 HH:MM:SS
      TIMELINE: "00:03:01"
      # 1=对所有文件重新生成; 0=只补缺失的(默认)
      OVERWRITE: "0"
      # ---- 限速(防网盘风控) ----
      # 每处理完 1 个文件休息多少秒
      FILE_DELAY: "5"
      # 每处理多少个文件后进入批量休息
      BATCH_SIZE: "30"
      # 批量休息多少秒
      BATCH_REST: "60"
      # 单个文件 ffmpeg 超时(秒), 慢速网盘可调大
      TIMEOUT: "300"
      # Web 前端端口; 设 0 关闭前端(只当后台 worker)
      WEB_PORT: "8081"
      WEB_ENABLED: "1"
    volumes:
      # 把你的 strm 媒体库挂到容器内 /link; 缩略图会生成在 .strm 同级目录
      - /path/to/media:/link
      # 配置文件持久化: Web 上保存的配置写在这里, 重建容器不丢
      - ./data:/data
